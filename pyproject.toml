[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netshield-gnn"
version = "2.0.0"
description = "DDoS detection and automated mitigation for IoT-cloud networks using dynamic fuzzing and Graph Neural Networks"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["ddos", "iot", "graph-neural-network", "network-simulation", "fuzzing", "network-security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3",
    "joblib>=1.3", "networkx>=3.0", "torch>=2.0", "matplotlib>=3.7",
    "PyYAML>=6.0", "fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.5",
]

[project.optional-dependencies]
gnn = ["torch-geometric>=2.4"]
research = ["lightgbm>=4.3", "optuna>=3.6", "dpkt>=1.9.8"]
platform = ["python-multipart>=0.0.9", "pyjwt>=2.8", "prometheus_client>=0.20",
            "onnx>=1.16", "onnxruntime>=1.18", "onnxscript>=0.1", "redis>=5.0"]
dev = ["pytest>=7.4", "httpx>=0.26", "hypothesis>=6.100", "pytest-cov>=5"]

[project.scripts]
netshield-serve = "netshield.api.app:get_app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 92
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "ANN", "B", "A", "C4", "SIM", "PL"]
ignore = ["D203", "D213", "ANN101", "ANN102", "ANN401", "PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN", "PLR2004", "SLF001"]
"scripts/*" = ["E402"]
