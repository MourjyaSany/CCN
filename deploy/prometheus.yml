global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files: ["/etc/prometheus/alerts.yml"]

scrape_configs:
  - job_name: netshield-api
    metrics_path: /metrics
    static_configs: [{ targets: ["api:8000"] }]
  - job_name: netshield-services
    metrics_path: /metrics
    static_configs:
      - targets: ["collector:9101", "features:9101", "inference:9101", "policy:9101"]
