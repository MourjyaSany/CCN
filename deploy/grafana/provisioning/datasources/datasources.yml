apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: TimescaleDB
    type: postgres
    access: proxy
    url: timescale:5432
    database: netshield
    user: netshield
    secureJsonData: { password: netshield }
    jsonData: { sslmode: disable, timescaledb: true, postgresVersion: 1600 }
