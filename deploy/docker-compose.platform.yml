# =============================================================================
# NetShield-GNN production-style stack
#
#   docker compose -f deploy/docker-compose.platform.yml up --build
#
#   api        FastAPI + dashboard, auth enforced          http://localhost:8000
#   collector  IPFIX receiver -> Redis Streams "flows"      udp/4739
#   features   flows -> node features                      (Redis consumer group)
#   inference  features -> scores/alerts (ONNX or PyTorch)  (scale with --scale)
#   policy     scores -> mitigation actions + rules
#   redis      message bus (Redis Streams)
#   timescale  TimescaleDB for window metrics and detections
#   prometheus scrapes /metrics of api and services         http://localhost:9090
#   grafana    dashboards provisioned from deploy/grafana   http://localhost:3000
# =============================================================================
x-netshield: &netshield
  build: { context: .., dockerfile: Dockerfile }
  image: netshield-gnn:2.0.0
  environment: &env
    NETSHIELD_ROOT: /app
    NETSHIELD_BUS: redis://redis:6379/0
    NETSHIELD_TIMESCALE_DSN: postgresql://netshield:netshield@timescale:5432/netshield
    NETSHIELD_JWT_SECRET: ${NETSHIELD_JWT_SECRET:?set a long random secret}
    PYTHONUNBUFFERED: "1"
  volumes:
    - ../results/research/predictions/final__all:/app/models/final:ro
    - ../config:/app/config:ro
  depends_on: [redis, timescale]
  restart: unless-stopped

services:
  api:
    <<: *netshield
    command: ["python", "scripts/serve.py", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *env
      NETSHIELD_AUTH: "1"
    ports: ["8000:8000"]

  collector:
    <<: *netshield
    command: ["python", "-m", "netshield.platform.service", "collector", "--listen", "0.0.0.0:4739"]
    ports: ["4739:4739/udp"]

  features:
    <<: *netshield
    command: ["python", "-m", "netshield.platform.service", "features"]

  inference:
    <<: *netshield
    command: ["python", "-m", "netshield.platform.service", "inference",
              "--models", "/app/models/final", "--detector", "graphsage"]

  policy:
    <<: *netshield
    command: ["python", "-m", "netshield.platform.service", "policy", "--export", "openflow"]

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]

  timescale:
    image: timescale/timescaledb:2.14.2-pg16
    environment:
      POSTGRES_USER: netshield
      POSTGRES_PASSWORD: netshield
      POSTGRES_DB: netshield
    volumes: [timescale-data:/var/lib/postgresql/data]

  prometheus:
    image: prom/prometheus:v2.51.2
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:10.4.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set a grafana password}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus, timescale]

volumes:
  redis-data:
  timescale-data:
