name: ci

on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff==0.6.9 mypy==1.11.2
      - name: Correctness lint (blocking)
        run: ruff check src scripts tests testbed launch.py --select E9,F,B --ignore B905,B008,B023
      - name: Style lint (advisory)
        run: ruff check src scripts tests testbed --exit-zero --statistics
      - name: Type-check the platform layer
        run: mypy --ignore-missing-imports --follow-imports=silent src/netshield/platform

  test:
    runs-on: ubuntu-24.04
    needs: lint
    strategy:
      matrix: { python: ["3.11", "3.12"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip }
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install -r requirements.txt pytest-cov
      - run: pip install -e .
      - name: Tests with coverage gate
        run: pytest -q --cov=netshield --cov-report=xml --cov-fail-under=75
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python }}
          path: coverage.xml

  benchmark:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install -r requirements.txt && pip install -e .
      - name: Performance regression check (fails on >25% slowdown)
        run: python scripts/benchmark.py --compare benchmarks/baseline.json --tolerance 0.25

  frontend:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
